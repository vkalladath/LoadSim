apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubectl apply -k deploy/k8s
#
# The image below lives in a private GitLab registry, so the namespace needs a
# pull secret first (see docs/KUBERNETES.md):
#   kubectl create secret docker-registry gitlab-registry \
#     --docker-server=registry.gitlab.com \
#     --docker-username='<deploy-token-username>' --docker-password='<deploy-token>'
#
# Point this at your own build with:
#   kustomize edit set image loadsim=ghcr.io/you/loadsim:v0.1.0
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment as needed:
  # - deployment-args-only.yaml
  # - servicemonitor.yaml
  # - hpa.yaml
  # - job.yaml

images:
  - name: loadsim
    newName: registry.gitlab.com/vkalladath/loadsim
    newTag: v0.2.0
