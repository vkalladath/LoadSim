apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubectl apply -k deploy/k8s
#
# Set your own image with:
#   kustomize edit set image loadsim=ghcr.io/you/loadsim:v0.1.0
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment as needed:
  # - deployment-args-only.yaml
  # - servicemonitor.yaml
  # - hpa.yaml
  # - job.yaml

images:
  - name: loadsim
    newName: loadsim
    newTag: dev
