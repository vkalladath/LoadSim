apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubectl apply -k deploy/k8s
#
# The image below is public, so this needs no pull secret and no arguments.
#
# Point this at your own build with:
#   kustomize edit set image loadsim=ghcr.io/you/loadsim:v0.1.0
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment as needed:
  # - deployment-args-only.yaml
  # - servicemonitor.yaml
  # - hpa.yaml
  # - job.yaml

images:
  - name: loadsim
    newName: registry.gitlab.com/vkalladath/loadsim
    newTag: v0.2.0
