# One-shot load: run the profile once and exit. hold_last=false makes the
# process stop when the last phase ends, which is what a Job wants.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadsim-once
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # The image is in a private GitLab registry. Create the secret once per
      # namespace, or attach it to the service account and delete this block:
      #   kubectl create secret docker-registry gitlab-registry \
      #     --docker-server=registry.gitlab.com \
      #     --docker-username='<deploy-token-username>' \
      #     --docker-password='<deploy-token>'
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: loadsim
          image: registry.gitlab.com/vkalladath/loadsim:v0.2.0
          args:
            - --phases=ramp:5m:cpu=10%->95%@linear:mem=20%->80%@linear
            - --hold-last=false
            # A belt-and-braces stop, in case the profile is edited to hold.
            - --exit-after=10m
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
