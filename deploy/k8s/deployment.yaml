apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadsim
  labels:
    app.kubernetes.io/name: loadsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadsim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadsim
      annotations:
        # Plain Prometheus scrape annotations; ServiceMonitor users can drop
        # these and apply servicemonitor.yaml instead.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # The image above is public, so no pull secret is needed. Pointing these
      # manifests at a private registry? Create the secret and uncomment:
      #   kubectl create secret docker-registry gitlab-registry \
      #     --docker-server=registry.gitlab.com \
      #     --docker-username='<deploy-token-username>' \
      #     --docker-password='<deploy-token>'
      # imagePullSecrets:
      #   - name: gitlab-registry
      containers:
        - name: loadsim
          image: registry.gitlab.com/vkalladath/loadsim:v0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/loadsim/profile.yaml
          env:
            # The downward API is how LoadSim learns what "50%" means. Without
            # these it falls back to the container's cgroup, which knows the
            # limit but not the request.
            - name: LOADSIM_CPU_REQUEST_MILLI
              valueFrom:
                resourceFieldRef:
                  containerName: loadsim
                  resource: requests.cpu
                  divisor: 1m
            - name: LOADSIM_CPU_LIMIT_MILLI
              valueFrom:
                resourceFieldRef:
                  containerName: loadsim
                  resource: limits.cpu
                  divisor: 1m
            - name: LOADSIM_MEMORY_REQUEST_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: loadsim
                  resource: requests.memory
                  divisor: "1"
            - name: LOADSIM_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: loadsim
                  resource: limits.memory
                  divisor: "1"
            # Any flag can be set through the environment instead of args;
            # uncomment to label this pod's metrics with its own name.
            # - name: LOADSIM_NAME
            #   valueFrom:
            #     fieldRef:
            #       fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # LoadSim is always live once the process is up; readiness is gated by
          # startup.ready_delay, so probes exercise rollout behaviour.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: profile
              mountPath: /etc/loadsim
              readOnly: true
      volumes:
        - name: profile
          configMap:
            name: loadsim-profile
